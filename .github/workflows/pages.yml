name: Deploy web GUI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: |
          pip install pytest
          PYTHONPATH=src pytest tests -q

      - name: Bundle site (page + engine source zip + self-hosted Pyodide)
        run: |
          mkdir -p _site
          cp site/index.html _site/
          (cd src && zip -qr ../_site/e2d_src.zip e2d)
          curl -fsSL -o /tmp/pyodide-core.tar.bz2 \
            https://github.com/pyodide/pyodide/releases/download/0.26.4/pyodide-core-0.26.4.tar.bz2
          mkdir -p _site/pyodide
          tar -xjf /tmp/pyodide-core.tar.bz2 -C _site/pyodide --strip-components=1

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
