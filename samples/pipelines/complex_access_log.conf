input {
  beats { port => 5044 }
}

filter {
  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
  }
  if [response] {
    mutate { convert => { "response" => "integer" "bytes" => "integer" } }
  }
  if [response] >= 500 {
    mutate { add_field => { "level" => "ERROR" } }
  } else {
    mutate { add_field => { "level" => "INFO" } }
  }
  kv {
    source => "request"
    field_split => "&"
    prefix => "query_"
  }
  geoip { source => "clientip" }
  mutate {
    rename => { "clientip" => "client.ip" }
    remove_field => ["ident", "auth"]
    gsub => ["agent", "\"", ""]
  }
  translate {
    field => "vhost"
    destination => "service.name"
    dictionary => { "shop.example.com" => "web-shop" "pay.example.com" => "payments" }
    fallback => "unknown"
  }
  if [query_debug] {
    drop { }
  }
}

output {
  elasticsearch { index => "web-shop-logs-%{+YYYY.MM.dd}" }
}
